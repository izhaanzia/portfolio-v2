<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c171e"/>
      <stop offset="50%" stop-color="#0a1318"/>
      <stop offset="100%" stop-color="#070c10"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f8b7d" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0f8b7d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f8b7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15222c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1922" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2bbfa9"/>
      <stop offset="100%" stop-color="#25d366"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#gridPattern)"/>
  <circle cx="400" cy="280" r="280" fill="url(#tealGlow)"/>

  <!-- Main CRM Mockup Card -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="90" width="520" height="380" rx="16" fill="url(#cardGrad)" stroke="rgba(43, 191, 169, 0.3)" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M 140 106 A 16 16 0 0 1 156 90 L 644 90 A 16 16 0 0 1 660 106 L 660 134 L 140 134 Z" fill="#0d1822"/>
    <circle cx="168" cy="112" r="5" fill="#ff5f56"/>
    <circle cx="184" cy="112" r="5" fill="#ffbd2e"/>
    <circle cx="200" cy="112" r="5" fill="#27c93f"/>
    <text x="400" y="116" fill="#8899a6" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">REPLORA CRM &amp; AI AGENT</text>

    <!-- Sidebar Mini -->
    <rect x="140" y="134" width="70" height="336" fill="#0b141c" opacity="0.6"/>
    <rect x="156" y="154" width="38" height="38" rx="10" fill="url(#accentGrad)"/>
    <text x="175" y="179" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">R</text>
    
    <circle cx="175" cy="220" r="10" fill="rgba(255,255,255,0.08)"/>
    <circle cx="175" cy="254" r="10" fill="rgba(255,255,255,0.08)"/>
    <circle cx="175" cy="288" r="10" fill="rgba(255,255,255,0.08)"/>
    <circle cx="175" cy="322" r="10" fill="rgba(255,255,255,0.08)"/>

    <!-- Left Subpanel: WhatsApp Chat Stream -->
    <rect x="226" y="150" width="200" height="300" rx="10" fill="#0d1922" stroke="rgba(255,255,255,0.05)"/>
    <!-- Chat Header -->
    <circle cx="248" cy="172" r="12" fill="#2bbfa9"/>
    <text x="248" y="176" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">WA</text>
    <text x="268" y="171" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Lead Follow-up</text>
    <text x="268" y="183" fill="#25d366" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">AI Agent Active</text>

    <!-- Chat Bubbles -->
    <!-- Incoming message -->
    <rect x="238" y="200" width="130" height="42" rx="8" fill="#1b2a36"/>
    <text x="248" y="217" fill="#e1e8ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Hi, need details on</text>
    <text x="248" y="230" fill="#e1e8ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">product consultation.</text>

    <!-- AI Agent Outgoing -->
    <rect x="274" y="252" width="142" height="48" rx="8" fill="#005c4b"/>
    <text x="284" y="269" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Hello! Booking your</text>
    <text x="284" y="282" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">consultation now ⚡</text>

    <!-- Quick action chip -->
    <rect x="250" y="310" width="150" height="24" rx="12" fill="rgba(43, 191, 169, 0.15)" stroke="rgba(43, 191, 169, 0.4)"/>
    <text x="325" y="326" fill="#2bbfa9" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ Slot Confirmed (11:00 AM)</text>

    <!-- Right Subpanel: Lead Kanban & Webhook -->
    <rect x="440" y="150" width="204" height="142" rx="10" fill="#0d1922" stroke="rgba(255,255,255,0.05)"/>
    <text x="454" y="172" fill="#8899a6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">WORKFLOW PIPELINE</text>
    
    <!-- Pipeline Badges -->
    <rect x="454" y="186" width="84" height="22" rx="6" fill="rgba(43, 191, 169, 0.15)"/>
    <text x="496" y="201" fill="#2bbfa9" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">n8n Connected</text>

    <rect x="546" y="186" width="86" height="22" rx="6" fill="rgba(124, 77, 219, 0.15)"/>
    <text x="589" y="201" fill="#a98bff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Webhook 200 OK</text>

    <rect x="454" y="220" width="178" height="60" rx="8" fill="#14202b" stroke="rgba(255,255,255,0.06)"/>
    <text x="466" y="240" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Automated Follow-ups</text>
    <text x="466" y="256" fill="#8899a6" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">CRM Lead Status Sync</text>
    <text x="466" y="270" fill="#25d366" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">● Live sync with Google Calendar</text>

    <!-- Bottom Metrics Row -->
    <rect x="440" y="306" width="98" height="66" rx="10" fill="#0d1922" stroke="rgba(255,255,255,0.05)"/>
    <text x="452" y="326" fill="#8899a6" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">REPLY RATE</text>
    <text x="452" y="352" fill="#2bbfa9" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">&lt; 2s</text>

    <rect x="546" y="306" width="98" height="66" rx="10" fill="#0d1922" stroke="rgba(255,255,255,0.05)"/>
    <text x="558" y="326" fill="#8899a6" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">AUTOMATION</text>
    <text x="558" y="352" fill="#e5a93c" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">100%</text>

    <rect x="440" y="384" width="204" height="66" rx="10" fill="linear-gradient(90deg, rgba(43, 191, 169, 0.1), rgba(37, 211, 102, 0.05))" stroke="rgba(43, 191, 169, 0.25)"/>
    <text x="456" y="410" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Universal WhatsApp AI Agent</text>
    <text x="456" y="432" fill="#8899a6" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">n8n Node Workflow · Live Dispatch</text>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(610, 430)">
    <rect width="130" height="38" rx="19" fill="#0e171f" stroke="#e5a93c" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="4" fill="#e5a93c"/>
    <text x="32" y="24" fill="#f3c669" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">n8n + AI CRM</text>
  </g>
</svg>